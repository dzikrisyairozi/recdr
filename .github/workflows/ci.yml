name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.98
        run: |
          rustup toolchain install 1.98 --profile minimal --component rustfmt --component clippy
          rustup default 1.98
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # One test at a time: the recording tests measure frame rates, and the macOS
      # runner's three cores cannot keep sixteen parallel recorders at 15 fps.
      - run: cargo test -- --test-threads=1
