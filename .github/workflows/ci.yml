name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.98
        run: |
          rustup toolchain install 1.98 --profile minimal --component rustfmt --component clippy
          rustup default 1.98
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # One test at a time: the recording tests measure frame rates, and the macOS
      # runner's three cores cannot keep sixteen parallel recorders at 15 fps.
      - run: cargo test -- --test-threads=1
      # Headless Chrome, which every runner image has. One at a time for the same reason.
      - run: cargo test --test browser -- --ignored --test-threads=1
      # spike/4-sck only (never merged): does a ScreenCaptureKit stream deliver frames
      # on a hosted runner? First as the crate builds by default, then with the Swift
      # runtime rpath that a dependent crate does not inherit from its build script.
      - if: runner.os == 'macOS'
        continue-on-error: true
        run: cargo run --manifest-path spike/sck/Cargo.toml -- frames display
      - if: runner.os == 'macOS'
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-rpath,/usr/lib/swift
        run: cargo run --manifest-path spike/sck/Cargo.toml -- frames display
