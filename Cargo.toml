[package]
name = "recdr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Screen recorder that AI agents drive through a CLI and an MCP server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "recdr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }
